[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qrm"
version = "0.2.0"
description = "Quantitative risk management library for FinTech 545"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[tool.setuptools]
packages = ["qrm"]
